<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="BijliSense AI. Understand your bill. Outsmart load-shedding." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A1A"/><stop offset="0.55" stop-color="#0F4029"/><stop offset="1" stop-color="#1F7044"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.32"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity="0.10"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .t { fill: #fff; font-weight: 800; letter-spacing: -1px; }
    .chip { fill: #fff; fill-opacity: 0.10; stroke: #fff; stroke-opacity: 0.28; }
    .chipt { fill: #E6F6EC; font-size: 14px; font-weight: 600; }
    .lab { fill: #fff; fill-opacity: 0.85; font-size: 12.5px; font-weight: 600; }
  </style>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#dots)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow)"/>

  <!-- logo + title -->
  <rect x="60" y="72" width="64" height="64" rx="16" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.3"/>
  <path d="M95 84 L77 109 H90 L84 126 L106 97 H92 Z" fill="#B7F7C8"/>
  <text x="144" y="122" font-size="52" class="t">BijliSense AI</text>
  <text x="60" y="186" font-size="23" font-weight="700" fill="#fff">Understand your bill. Outsmart load-shedding.</text>
  <text x="60" y="224" font-size="15" fill="#BFE3CC">See where your units go, test a change before you make it,</text>
  <text x="60" y="246" font-size="15" fill="#BFE3CC">and check what keeps running when the power goes.</text>

  <rect x="60" y="278" width="156" height="34" rx="17" class="chip"/><text x="138" y="300" text-anchor="middle" class="chipt">Calculation engine</text>
  <rect x="226" y="278" width="124" height="34" rx="17" class="chip"/><text x="288" y="300" text-anchor="middle" class="chipt">Groq AI agent</text>
  <rect x="360" y="278" width="196" height="34" rx="17" class="chip"/><text x="458" y="300" text-anchor="middle" class="chipt">3D power-cut simulator</text>

  <!-- energy graph -->
  <g stroke-linecap="round" fill="none">
    <path d="M690 112 L790 200" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 7"/>
    <path d="M880 108 L790 200" stroke="#7FD6A6" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="3 7"/>
    <path d="M642 205 L790 200" stroke="#7FD6A6" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="3 7"/>
    <path d="M890 292 L790 200" stroke="#7FD6A6" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="3 7"/>
    <path d="M702 292 L790 200" stroke="#FBBF24" stroke-opacity="0.9" stroke-width="2.2" stroke-dasharray="3 7"/>
  </g>
  <circle cx="690" cy="112" r="26" fill="#EF4444" fill-opacity="0.18"/><circle cx="690" cy="112" r="14" fill="#EF4444"/>
  <circle cx="880" cy="108" r="22" fill="#34D399" fill-opacity="0.18"/><circle cx="880" cy="108" r="12" fill="#34D399"/>
  <circle cx="642" cy="205" r="20" fill="#34D399" fill-opacity="0.18"/><circle cx="642" cy="205" r="10" fill="#34D399"/>
  <circle cx="890" cy="292" r="22" fill="#34D399" fill-opacity="0.18"/><circle cx="890" cy="292" r="12" fill="#34D399"/>
  <circle cx="702" cy="292" r="26" fill="#FBBF24" fill-opacity="0.2"/><circle cx="702" cy="292" r="14" fill="#FBBF24"/>
  <circle cx="790" cy="200" r="46" fill="#fff" fill-opacity="0.08"/><circle cx="790" cy="200" r="32" fill="#fff"/>
  <path d="M774 203 L790 187 L806 203 M778 200 V216 H802 V200" fill="none" stroke="#0F4029" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="690" y="148" text-anchor="middle" class="lab">Grid</text>
  <text x="880" y="142" text-anchor="middle" class="lab">AC</text>
  <text x="642" y="236" text-anchor="middle" class="lab">Fans</text>
  <text x="890" y="326" text-anchor="middle" class="lab">Fridge</text>
  <text x="702" y="326" text-anchor="middle" class="lab">Battery</text>

  <!-- status card -->
  <g filter="url(#shadow)">
    <rect x="935" y="92" width="225" height="176" rx="16" fill="#fff"/>
  </g>
  <rect x="953" y="110" width="88" height="24" rx="12" fill="#FEE2E2"/>
  <circle cx="967" cy="122" r="4" fill="#DC2626"/>
  <text x="976" y="127" font-size="11.5" font-weight="800" fill="#B91C1C">GRID DOWN</text>
  <text x="1142" y="127" text-anchor="end" font-size="11.5" fill="#6B7F72">Demo household</text>
  <text x="953" y="170" font-size="17" font-weight="800" fill="#0F3D26">Battery: 1 h 13 min left</text>
  <text x="953" y="192" font-size="12.5" fill="#4A6654">Fans, fridge and lights stay on.</text>
  <text x="953" y="210" font-size="12.5" fill="#4A6654">AC has no power.</text>
  <rect x="953" y="226" width="62" height="24" rx="12" fill="#DCFCE7"/><text x="984" y="242" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">Fridge on</text>
  <rect x="1022" y="226" width="56" height="24" rx="12" fill="#FEF3C7"/><text x="1050" y="242" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400E">AC off</text>
  <rect x="1085" y="226" width="62" height="24" rx="12" fill="#E0F2F1"/><text x="1116" y="242" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0B6B5E">Estimate</text>
</svg>
